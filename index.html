<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Olympiad Quest - AI-Powered IMO & ISO Prep</title>
    <meta name="description" content="AI-powered Olympiad preparation app for IMO & ISO (Standards 4 & 7). 44 topics, unlimited AI-generated questions, gamified learning with anime-style progression." />
    <meta name="theme-color" content="#667eea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Olympiad Quest" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Olympiad Quest - AI-Powered IMO & ISO Prep" />
    <meta property="og:description" content="44 topics, unlimited AI-generated questions, gamified learning. Prepare for IMO & ISO with Google Gemini AI." />
    <meta property="og:site_name" content="Olympiad Quest" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Olympiad Quest - AI-Powered IMO & ISO Prep" />
    <meta name="twitter:description" content="44 topics, unlimited AI-generated questions, gamified learning. Prepare for IMO & ISO with Google Gemini AI." />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon (inline SVG) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23667eea'/%3E%3Cstop offset='100%25' style='stop-color:%23764ba2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.dark, html.dark body { background-color: #0a0a1a !important; color: #ffffff; }
      #root { min-height: 100vh; }
      /* Prevent FOUC */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #0a0a1a, #1a1a3e);
        color: white;
        font-family: system-ui, sans-serif;
      }
      .app-loading .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(102, 126, 234, 0.2);
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <div style="text-align: center;">
          <div class="spinner" style="margin: 0 auto 16px;"></div>
          <p style="opacity: 0.7;">Loading Olympiad Quest...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
